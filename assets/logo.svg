<?xml version="1.0" encoding="UTF-8"?>
<!-- 进场 LOGO：VVXIE.CN + 上下两条线 + 字内高光。可直接用 Illustrator 改。
     约定（改的时候请保留）：
     1) 每个字符一个 <path>，id 依次 ch-1 … ch-8，顺序即出场顺序；
     2) 两条线 <rect id="rule-top/rule-bottom">，fill=currentColor，粗细随字高缩放；
     3) 高光 = #sheen-bar 一条白带，被 #logo-clip（字母形状）裁住，只在字内扫过；
        不想要闪光，把整段 <g id="sheen"> 删掉即可；
     4) 只用路径几何（不要 <text>），fill 用 currentColor；
     5) viewBox 贴合内容，页面按「字母墨迹高度」自动缩放。 -->
